name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia'
          cache: true
      - name: Windows build, tests and deployment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/setup-ffmpeg.ps1
          ./tools/build-windows.ps1 -Deploy
      - name: macOS build and tests
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 3
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix dist/FARecorder-macOS
      - name: Windows installer and preservation tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/package-windows.ps1 -BundleRoot dist/FARecorder-Windows-x64 -OutputDirectory artifacts/installer-ci -TestPackage
          $version=([regex]::Match((Get-Content app/AppInfo.h -Raw),'version = "([^"]+)"')).Groups[1].Value
          ./tools/test-windows-installer.ps1 -Installer "artifacts/installer-ci/FARecorder-$version-windows-x64-Setup-test.exe"
          ./tools/package-windows.ps1 -BundleRoot dist/FARecorder-Windows-x64 -OutputDirectory dist/releases
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FARecorder-${{ runner.os }}-test-diagnostics
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
      - name: Upload Windows release files
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@v4
        with:
          name: FARecorder-Windows-release
          path: dist/releases/
          if-no-files-found: error
      - name: Upload development build
        uses: actions/upload-artifact@v4
        with:
          name: FARecorder-${{ runner.os }}-development
          path: dist/
          if-no-files-found: error
